        <animate attributeName="stop-color" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" values="#161616;#160000;#221044;#161616;#16140C"/>
      </stop>
      <stop offset="100%" stop-color="#050505">
        <animate attributeName="stop-color" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" values="#050505;#000000;#0b0618;#000000;#0A0A08"/>
      </stop>
    </linearGradient>
    <radialGradient id="bloom" cx="14%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.14">
        <animate attributeName="stop-color" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" values="#E11D48;#FF0033;#7c5cff;#A1A1AA;#00F0FF"/>
        <animate attributeName="stop-opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" values="0.14;0.18;0.16;0.10;0.12"/>
      </stop>
      <stop offset="70%" stop-color="#E11D48" stop-opacity="0.04">
        <animate attributeName="stop-color" dur="15s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" values="#E11D48;#FF0033;#7c5cff;#A1A1AA;#00F0FF"/>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Austin playlist player">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="55%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d2818"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#FDB515"/>
    </linearGradient>
    <clipPath id="artClip">
      <rect x="36" y="36" width="148" height="148" rx="12"/>
    </clipPath>
  </defs>

  <rect width="900" height="220" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="218" rx="17" fill="none" stroke="#2a2a2a" stroke-width="2"/>

  <rect x="36" y="36" width="148" height="148" rx="12" fill="#222"/>
  <g clip-path="url(#artClip)">
    <rect x="36" y="36" width="148" height="148" fill="#1e3a2f"/>
    <circle cx="110" cy="110" r="46" fill="#121212"/>
    <circle cx="110" cy="110" r="16" fill="#1DB954"/>
    <path d="M92 88 L136 110 L92 132 Z" fill="#FDB515"/>
  </g>

  <text x="210" y="58" fill="#1DB954" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">NOW PLAYING</text>
  <circle cx="318" cy="53" r="5" fill="#1DB954">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="210" y="98" fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Austin's Playlist</text>
  <text x="210" y="128" fill="#B3B3B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">CS @ Waterloo · Vancouver · tools, music, games</text>

  <rect x="210" y="152" width="420" height="6" rx="3" fill="#333"/>
  <rect x="210" y="152" height="6" rx="3" fill="url(#accent)" width="80">
    <animate attributeName="width" values="60;300;60" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="210" y="178" fill="#888" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">0:42</text>
  <text x="600" y="178" fill="#888" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="end">3:17</text>

  <!-- SMIL equalizer (works better than CSS on GitHub camo) -->
  <g transform="translate(690, 175)">
    <text x="0" y="-130" fill="#B3B3B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1">LIVE EQ</text>
    <rect x="0" y="-20" width="10" height="20" rx="3" fill="#1DB954">
      <animate attributeName="height" values="18;88;24;72;18" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-18;-88;-24;-72;-18" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="-20" width="10" height="20" rx="3" fill="#3ddc84">
      <animate attributeName="height" values="28;96;20;80;28" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-28;-96;-20;-80;-28" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="32" y="-20" width="10" height="20" rx="3" fill="#FDB515">
      <animate attributeName="height" values="22;70;40;100;22" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-22;-70;-40;-100;-22" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="-20" width="10" height="20" rx="3" fill="#1DB954">
      <animate attributeName="height" values="35;90;18;65;35" dur="1.25s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-35;-90;-18;-65;-35" dur="1.25s" repeatCount="indefinite"/>
    </rect>
    <rect x="64" y="-20" width="10" height="20" rx="3" fill="#3ddc84">
      <animate attributeName="height" values="20;85;30;95;20" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-20;-85;-30;-95;-20" dur="0.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="-20" width="10" height="20" rx="3" fill="#FDB515">
      <animate attributeName="height" values="40;75;22;100;40" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-40;-75;-22;-100;-40" dur="1.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="96" y="-20" width="10" height="20" rx="3" fill="#1DB954">
      <animate attributeName="height" values="16;92;28;60;16" dur="0.85s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-16;-92;-28;-60;-16" dur="0.85s" repeatCount="indefinite"/>
    </rect>
    <rect x="112" y="-20" width="10" height="20" rx="3" fill="#3ddc84">
      <animate attributeName="height" values="30;100;18;78;30" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-30;-100;-18;-78;-30" dur="1.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="128" y="-20" width="10" height="20" rx="3" fill="#FDB515">
      <animate attributeName="height" values="24;68;42;96;24" dur="0.75s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-24;-68;-42;-96;-24" dur="0.75s" repeatCount="indefinite"/>
    </rect>
    <rect x="144" y="-20" width="10" height="20" rx="3" fill="#1DB954">
      <animate attributeName="height" values="18;88;26;70;18" dur="1.0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-18;-88;-26;-70;-18" dur="1.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="820" cy="40" r="18" fill="#1DB954" opacity="0.2">
    <animate attributeName="opacity" values="0.12;0.35;0.12" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="14;22;14" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
